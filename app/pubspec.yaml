name: app
description: "FocusGuard - Cross-platform digital wellbeing app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  file_selector: ^1.0.3
  image_picker: ^1.1.2
  video_player: ^2.8.6
  video_player_win: ^3.3.1
  flutter_local_notifications: ^17.1.2
  intl: ^0.19.0
  win32: ^5.5.4
  ffi: ^2.1.3
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
